<rect x="60" y="20" width="190" height="44" fill="#fef3f2" stroke="#b42318"/>
<text x="66" y="34" font-size="10" fill="#7a271a">D1: Feedback reativo, só quando</text>
<text x="66" y="46" font-size="10" fill="#7a271a">há problema (E1-4, E1-9, E2-4)</text>
<rect x="190" y="190" width="190" height="44" fill="#fef3f2" stroke="#b42318"/>
<text x="196" y="204" font-size="10" fill="#7a271a">D2: Sem padrão de canal:</text>
<text x="196" y="216" font-size="10" fill="#7a271a">presencial, Teams ou mensagem</text>
<text x="196" y="228" font-size="10" fill="#7a271a">(E1-5, E2-5)</text>
<rect x="360" y="420" width="190" height="44" fill="#fef3f2" stroke="#b42318"/>
<text x="366" y="434" font-size="10" fill="#7a271a">D7: Feedback vago, sem clareza do</text>
<text x="366" y="446" font-size="10" fill="#7a271a">que mudar (E2-8, E2-10)</text>
<rect x="640" y="205" width="190" height="44" fill="#fef3f2" stroke="#b42318"/>
<text x="646" y="219" font-size="10" fill="#7a271a">D3: Sem registro: muita coisa</text>
<text x="646" y="231" font-size="10" fill="#7a271a">fica só na memória (E1-6, E2-9)</text>
<rect x="780" y="420" width="190" height="44" fill="#fef3f2" stroke="#b42318"/>
<text x="786" y="434" font-size="10" fill="#7a271a">D4: Sem histórico único para</text>
<text x="786" y="446" font-size="10" fill="#7a271a">consultar (E1-8, E2-6)</text>
<rect x="1040" y="420" width="190" height="44" fill="#fef3f2" stroke="#b42318"/>
<text x="1046" y="434" font-size="10" fill="#7a271a">D6: Sem retorno para saber se</text>
<text x="1046" y="446" font-size="10" fill="#7a271a">melhorou (E2-7, E2-8)</text>
<rect x="1270" y="215" width="190" height="44" fill="#fef3f2" stroke="#b42318"/>
<text x="1276" y="229" font-size="10" fill="#7a271a">D5: Esquecer de retomar o</text>
<text x="1276" y="241" font-size="10" fill="#7a271a">combinado (E1-7, E1-10, E2-9)</text>
